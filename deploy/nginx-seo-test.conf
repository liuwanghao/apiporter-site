# Test environment only. Keep API proxy settings aligned with the original config.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /opt/apiporter-site/current/dist;
    index index.html;
    client_max_body_size 100m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~ ^/(api|v1|v1beta|pg|mj|kling|jimeng|suno)(/|$) {
        proxy_pass http://apiporter_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location ^~ /dashboard/billing/ {
        proxy_pass http://apiporter_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location ~ ^/[^/]+/mj(/|$) {
        proxy_pass http://apiporter_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location = /robots.txt { default_type text/plain; try_files $uri =404; }
    location = /sitemap.xml { default_type application/xml; try_files $uri =404; }
    location = /app.html { internal; }
    location = /404.html { internal; }
    error_page 404 /404.html;

    # Existing private, callback and legacy SPA paths; authentication stays in app/backend.
    location ~ ^/(dashboard|wallet|users|usage-logs|keys|channels|models|profile|system-settings|system-info|subscriptions|promotion|promotion-partner|redemption-codes|relay-error-admin|playground|chat|chat2link|errors|console|oauth|user/reset)(/|$) {
        try_files $uri /app.html;
    }
    location ~ ^/(sign-in|sign-up|forgot-password|reset|register|otp|login|forbidden|setup|401|403|404|500|503|about|privacy-policy|user-agreement|rankings)/?$ {
        try_files $uri /app.html;
    }
    # Dynamic model validity requires the live public catalog; preserve SPA details.
    location ~ ^/pricing/[^/]+/?$ { try_files $uri /app.html; }
    location / {
        try_files $uri/index.html $uri =404;
    }
}
